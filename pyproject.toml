[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "medical-triage-ml"
version = "0.1.0"
description = "Text classification system for medical triage"
requires-python = ">=3.11"
dependencies = [
    "pandas",
    "scikit-learn",
    "fastapi",
    "uvicorn",
    "joblib"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "httpx"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88