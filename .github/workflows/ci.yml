name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint-test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints.txt

      - name: Install dependencies
        run: |
          python -m pip install -c constraints.txt ".[dev]"
          python -m pip check

      - name: Lint
        run: python -m ruff check src tests scripts

      - name: Run tests
        run: python -m pytest tests/ -v

      - name: Create synthetic CI model
        run: |
          python scripts/create_ci_model.py \
            --output models/ci_smoke_model.joblib

      - name: Build Docker image
        run: |
          docker build \
            --build-arg MODEL_PATH=models/ci_smoke_model.joblib \
            -t medical-triage-api:ci .

      - name: Start API container
        run: |
          docker run -d \
            --name medical-triage-api-ci \
            -p 127.0.0.1:8002:8000 \
            medical-triage-api:ci

      - name: Wait for API readiness
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent --max-time 2 \
              http://127.0.0.1:8002/health; then
              exit 0
            fi
            sleep 2
          done

          echo "API did not become ready."
          exit 1

      - name: Smoke test prediction and validation
        run: |
          python - <<'PY'
          import httpx

          with httpx.Client(
              base_url="http://127.0.0.1:8002",
              timeout=10.0,
              trust_env=False,
          ) as client:
              response = client.post(
                  "/predict",
                  json={
                      "text": "cardiac artery cardiovascular clinical study"
                  },
              )

              assert response.status_code == 200, response.text
              assert response.json() == {
                  "condition_label": 4,
                  "condition_name": "cardiovascular diseases",
              }, response.text

              invalid_response = client.post(
                  "/predict",
                  json={"text": "   "},
              )

              assert invalid_response.status_code == 422, invalid_response.text

          print("Container smoke tests passed.")
          PY

      - name: Show container logs
        if: always()
        run: |
          if docker container inspect medical-triage-api-ci >/dev/null 2>&1; then
            docker logs medical-triage-api-ci
          fi

      - name: Remove CI container
        if: always()
        run: |
          if docker container inspect medical-triage-api-ci >/dev/null 2>&1; then
            docker rm -f medical-triage-api-ci
          fi